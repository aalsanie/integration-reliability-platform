services:
  postgres:
    image: postgres:17-alpine
    container_name: irp-postgres
    environment:
      POSTGRES_DB: irp
      POSTGRES_USER: irp
      POSTGRES_PASSWORD: irp
    ports:
      - "5432:5432"
    volumes:
      - irp_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U irp -d irp"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  irp_postgres_data: